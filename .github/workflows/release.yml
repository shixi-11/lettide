name: Desktop installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes_only:
        description: '只更新双语说明 / Update bilingual notes only'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  prepare_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate and generate bilingual notes
        run: |
          node --test tests/release-notes.test.mjs
          node scripts/Prepare-Release.mjs
      - name: Create or update bilingual release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_ONLY: ${{ inputs.notes_only }}
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          tag="v$version"
          tag_commit="$(git rev-parse "$tag^{commit}")"
          if [ "$NOTES_ONLY" != "true" ] && [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
            echo "Installer builds must use the exact version tag. Use notes_only for documentation updates."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "叠信 · Lettide $version" --notes-file "output/release-notes-$version.md"
          else
            gh release create "$tag" --verify-tag --prerelease --title "叠信 · Lettide $version" --notes-file "output/release-notes-$version.md"
          fi
  build:
    needs: prepare_release
    if: ${{ inputs.notes_only != true }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        language: [zh-CN, en]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        shell: bash
        run: |
          for folder in backend web desktop; do
            (cd "$folder" && pnpm install --frozen-lockfile)
          done
          cd desktop && node node_modules/electron/install.js
      - name: Backend checks, including real OS protected storage
        shell: bash
        run: node --test backend/tests/*.test.js
      - name: Build interface
        working-directory: web
        run: pnpm build
      - name: Build desktop installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          args=""
          if [ "${{ runner.os }}" = "macOS" ]; then args="$args --mac"; fi
          if [ "${{ matrix.language }}" = "en" ]; then args="$args --en"; fi
          node scripts/Build-Desktop.mjs $args
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}-${{ matrix.language }}
          path: |
            output/desktop/*.exe
            output/desktop/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Publish release installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(output/desktop/*.exe output/desktop/*.dmg)
          tag="$(node -p "'v'+require('./desktop/package.json').version")"
          language="简体中文 / Chinese"
          if [ "${{ matrix.language }}" = "en" ]; then language="English / 英文"; fi
          platform="Windows x64"
          if [ "${{ runner.os }}" = "macOS" ]; then platform="macOS · Apple Silicon + Intel"; fi
          for file in "${files[@]}"; do
            gh release upload "$tag" "$file#$platform · $language" --clobber
          done
