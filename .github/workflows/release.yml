name: Desktop installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Existing version tag to build / 要构建的现有版本标签'
        type: string
        default: ''
      platform:
        description: 'Platforms to verify / 检查的平台'
        type: choice
        options: [all, linux]
        default: all
      notes_only:
        description: '只更新双语说明 / Update bilingual notes only'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: lettide-desktop-releases
  cancel-in-progress: false
jobs:
  prepare_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate bilingual notes and download paths
        run: |
          node --test tests/release-notes.test.mjs tests/downloads.test.mjs
          node scripts/Prepare-Release.mjs
      - name: Prepare release draft
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_ONLY: ${{ inputs.notes_only }}
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          tag="v$version"
          if [ "$NOTES_ONLY" != "true" ] && [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "Installer builds must use their exact version tag."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$NOTES_ONLY" != true ] && [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true ]; then
              echo "Published installers are immutable. Choose a new version for another full build."
              exit 1
            fi
            gh release edit "$tag" --title "叠信 · Lettide $version" --notes-file "output/release-notes-$version.md"
          else
            gh release create "$tag" --verify-tag --draft --prerelease --title "叠信 · Lettide $version" --notes-file "output/release-notes-$version.md"
          fi
  build:
    needs: prepare_release
    if: ${{ inputs.notes_only != true }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-22.04"]' || '["windows-latest","macos-latest","ubuntu-22.04"]') }}
        language: [zh-CN, en]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linux packaging and isolated keyring dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libsecret-tools gnome-keyring dbus-x11 xvfb xauth rpm libarchive-tools libfuse2 fonts-wqy-microhei
      - name: Install locked dependencies
        shell: bash
        run: |
          for folder in backend web desktop; do
            (cd "$folder" && pnpm install --frozen-lockfile)
          done
          cd desktop && node node_modules/electron/install.js
      - name: Backend checks, including native OS storage
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            bash scripts/With-LinuxKeyring.sh env LETTIDE_TEST_SECRET_SERVICE=1 node --test backend/tests/*.test.js
          else
            node --test backend/tests/*.test.js
          fi
      - name: Build interface
        working-directory: web
        run: pnpm build
      - name: Build desktop installers
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          args=()
          if [ "${{ runner.os }}" = macOS ]; then args+=(--mac); fi
          if [ "${{ runner.os }}" = Linux ]; then args+=(--linux); fi
          if [ "${{ matrix.language }}" = en ]; then args+=(--en); fi
          node scripts/Build-Desktop.mjs "${args[@]}"
      - name: Verify packaged native dependencies on Windows and Mac
        if: runner.os != 'Linux'
        run: node scripts/Verify-PackagedRuntime.mjs
      - name: Install Windows EXE and verify installed app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -LiteralPath output/desktop -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'lettide-installed'
          $result = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S', '/currentuser', "/D=$installRoot") -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Windows installation failed' }
          $env:LETTIDE_TEST_EXECUTABLE = Join-Path $installRoot 'Lettide.exe'
          if (-not (Test-Path -LiteralPath $env:LETTIDE_TEST_EXECUTABLE -PathType Leaf)) { throw 'Installed executable missing' }
          node scripts/Verify-PackagedRuntime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed native runtime failed' }
          node tests/installed-desktop-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop check failed' }
      - name: Mount Mac DMG and verify copied application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          images=(output/desktop/*.dmg)
          test "${#images[@]}" = 1
          mount="$RUNNER_TEMP/lettide-dmg"
          install="$RUNNER_TEMP/lettide-installed"
          mkdir -p "$mount" "$install"
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          apps=("$mount"/*.app)
          test "${#apps[@]}" = 1
          app="$install/$(basename "${apps[0]}")"
          ditto "${apps[0]}" "$app"
          binaries=("$app/Contents/MacOS/"*)
          test "${#binaries[@]}" = 1
          export LETTIDE_TEST_EXECUTABLE="${binaries[0]}"
          node scripts/Verify-PackagedRuntime.mjs
          node tests/installed-desktop-smoke.mjs
      - name: Install Linux DEB and verify UI, keyring, translation runtime and MCP
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb=(output/desktop/*.deb)
          test "${#deb[@]}" = 1
          sudo apt-get install -y "./${deb[0]}"
          export LETTIDE_TEST_EXECUTABLE="$(readlink -f /usr/bin/Lettide)"
          test -f "$LETTIDE_TEST_EXECUTABLE" && test -x "$LETTIDE_TEST_EXECUTABLE"
          xvfb-run -a bash scripts/With-LinuxKeyring.sh bash -euc '
            node scripts/Verify-PackagedRuntime.mjs
            node scripts/Verify-PackagedRuntime.mjs --appimage
            node tests/installed-desktop-smoke.mjs
            node tests/appimage-mcp-smoke.mjs
          '
          rpm -qp --requires output/desktop/*.rpm | grep -q libsecret
      - name: Install RPM and verify native runtime on Fedora
        if: runner.os == 'Linux' && matrix.language == 'en'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace fedora:44 bash -euc '
            dnf install -y /workspace/output/desktop/*.rpm dbus-daemon xorg-x11-server-Xvfb shadow-utils util-linux
            Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
            xpid=$!
            trap "kill $xpid" EXIT
            export DISPLAY=:99
            export LETTIDE_TEST_EXECUTABLE="$(readlink -f /usr/bin/Lettide)"
            test -f "$LETTIDE_TEST_EXECUTABLE" && test -x "$LETTIDE_TEST_EXECUTABLE"
            useradd --create-home lettide-test
            runuser -u lettide-test -- bash scripts/With-LinuxKeyring.sh env ELECTRON_RUN_AS_NODE=1 "$LETTIDE_TEST_EXECUTABLE" /workspace/scripts/Verify-PackagedRuntime.mjs
          '
      - name: Upload checked installers to release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          tag="v$version"
          node --input-type=module -e "import {installerAssets} from './desktop/release-targets.mjs'; console.log(installerAssets('$version').filter(a=>a.platform==='${{ runner.os == 'Windows' && 'win' || runner.os == 'macOS' && 'mac' || 'linux' }}'&&a.language==='${{ matrix.language }}').map(a=>a.name+'#'+a.label).join('\n'))" > output/installers-to-publish.txt
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          while IFS= read -r item; do
            name="${item%%#*}"
            test -f "output/desktop/$name"
            gh release upload "$tag" "output/desktop/$item" --clobber
          done < output/installers-to-publish.txt
  publish:
    needs: [prepare_release, build]
    if: ${{ inputs.notes_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check complete release, publish and verify every public download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node scripts/Verify-ReleaseDownloads.mjs --metadata-only
          tag="$(node -p "'v'+require('./desktop/package.json').version")"
          gh release edit "$tag" --draft=false --prerelease
          node scripts/Verify-ReleaseDownloads.mjs
